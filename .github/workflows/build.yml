name: Build and Release App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r App/requirements.txt

      - name: Install Dashboard dependencies
        working-directory: App/Dashboard
        run: npm install

      - name: Build Application
        working-directory: App
        run: python build_all.py

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MorgiFile-windows
          path: App/dist/MorgiFile.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r App/requirements.txt

      - name: Install Dashboard dependencies
        working-directory: App/Dashboard
        run: npm install

      - name: Build Application
        working-directory: App
        run: python3 build_all.py

      - name: Package macOS DMG
        working-directory: App/dist
        run: |
          hdiutil create -volname "MorgiFile" -srcfolder MorgiFile.app -ov -format UDZO MorgiFile.dmg

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MorgiFile-macos
          path: App/dist/MorgiFile.dmg

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: MorgiFile-windows
          path: ./dist

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: MorgiFile-macos
          path: ./dist

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MorgiFile.exe
            dist/MorgiFile.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
