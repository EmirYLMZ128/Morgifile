name: Build and Release App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r App/requirements.txt

      - name: Install Dashboard dependencies
        working-directory: App/Dashboard
        run: npm install

      - name: Build Application
        working-directory: App
        run: python build_all.py

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MorgiFile-windows
          path: App/dist/MorgiFile.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r App/requirements.txt

      - name: Install Dashboard dependencies
        working-directory: App/Dashboard
        run: npm install

      - name: Generate macOS .icns icon file
        run: |
          mkdir icon.iconset
          sips -z 16 16     App/icon.png --out icon.iconset/icon_16x16.png
          sips -z 32 32     App/icon.png --out icon.iconset/icon_16x16@2x.png
          sips -z 32 32     App/icon.png --out icon.iconset/icon_32x32.png
          sips -z 64 64     App/icon.png --out icon.iconset/icon_32x32@2x.png
          sips -z 128 128   App/icon.png --out icon.iconset/icon_128x128.png
          sips -z 256 256   App/icon.png --out icon.iconset/icon_128x128@2x.png
          sips -z 256 256   App/icon.png --out icon.iconset/icon_256x256.png
          sips -z 512 512   App/icon.png --out icon.iconset/icon_256x256@2x.png
          sips -z 512 512   App/icon.png --out icon.iconset/icon_512x512.png
          sips -z 1024 1024 App/icon.png --out icon.iconset/icon_512x512@2x.png
          iconutil -c icns icon.iconset -o App/icon.icns

      - name: Build Application
        working-directory: App
        run: python3 build_all.py

      - name: Package macOS DMG
        working-directory: App/dist
        run: |
          mkdir dmg_root
          cp -R MorgiFile.app dmg_root/
          ln -s /Applications dmg_root/Applications
          hdiutil create -volname "MorgiFile" -srcfolder dmg_root -ov -format UDZO MorgiFile.dmg

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MorgiFile-macos
          path: App/dist/MorgiFile.dmg

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: MorgiFile-windows
          path: ./dist

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: MorgiFile-macos
          path: ./dist

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MorgiFile.exe
            dist/MorgiFile.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
